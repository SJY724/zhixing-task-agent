# Activate together with the application-added agent profile: --spring.profiles.active=agent-mysql
# Use a dedicated schema/user. Credentials stay in the launching process environment.
spring:
  datasource:
    url: ${TASK_AGENT_DB_URL:jdbc:mysql://127.0.0.1:3306/zhixing?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000}
    username: ${TASK_AGENT_DB_USERNAME:zhixing_app}
    password: ${TASK_AGENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000
      initialization-fail-timeout: 10000
